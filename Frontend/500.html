<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>server error</title>
    <link rel="shortcut icon" href="/Frontend/assets/BOSS-LOGO.ico" type="image/x-icon">
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: cyan;
            height: 90vh;
            margin: 0;
            padding: 10px;
        }

        .cont {
            display: grid;
            align-items: center;
            justify-content: center;
            height: 50vh;
            background-color: #fff;
            border: none;
            box-shadow: rgb(red, green, blue);
            border-radius: 8px;
            width: 500px;
            text-align: center;

        }

        img {
            border-radius: 42%;
        }

        
        #bkc{
            border-radius: 8px;
            background-color: #0f0f;
            font-family: sans-serif;
            font-weight: bold;
            border: none;
            padding: 10px;
            cursor: pointer;
            transition: all;
            transition-duration: 1.2s;
        }

        #bkc:hover {
            font-size: x-large;
            background: green;
            color: white;
        }

        h2 {
            color: royalblue;
            font-family: 'Courier New';
        }
    </style>
</head>

<body>
    <div class="cont">
        <div class="photo">
            <img src="/Frontend/assets/BOSS-LOGO.png">
        </div>
        <h2>Opps! sorry we couldn't connect to server.</h2>
        <div class="btn">
            <input type="button" value="BACK" id="bkc">
        </div>
    </div>
    <script>
        // LOGIN button redirect
        document.getElementById("bkc").addEventListener("click", function () {
            window.location.href = "/";
        });
    </script>
</body>
</div>

</html>
